appId: work.selman.ultra-harddisk-defrag
productName: Ultra Harddisk Defrag
copyright: Ultra Harddisk Defrag 1.0
directories:
  buildResources: build
  output: release
afterPack: scripts/after-pack.cjs
files:
  - out/**
  - resources/**
  - package.json
extraResources:
  - from: resources/data
    to: data
  - from: build/icon.png
    to: icon.png
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: UltraHarddiskDefrag-${version}-${arch}.${ext}
  # No code-signing certificate: the build is unsigned, so SmartScreen warns once.
  # signAndEditExecutable stays false because rcedit (scripts/patch-exe.mjs) applies the
  # icon and version strings without electron-builder's winCodeSign toolchain.
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Ultra Harddisk Defrag
  uninstallDisplayName: Ultra Harddisk Defrag 1.0
